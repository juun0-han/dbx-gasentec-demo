bundle:
  name: dbx-gasentec-demo

include:
  - resources/gasentec_demo.resources.yml

sync:
  paths:
    - notebooks
    - resources
    - sample_data

variables:
  catalog:
    description: GasEntec Demo Unity Catalog
    default: issu_dip_wksp
  landing_schema:
    description: Raw Volume과 원천 데이터 Schema
    default: gasentec_landing
  schema:
    description: Bronze, Silver, Gold와 Metric View 대상 Schema
    default: gasentec_hands_on
  warehouse_id:
    description: Demo SQL task에 사용할 Warehouse ID
    default: 3090f2a1f1105378

targets:
  demo:
    mode: development
    default: true
    workspace:
      host: https://dbc-9f87ed8e-e4c2.cloud.databricks.com
      profile: issu-dip-wksp
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
